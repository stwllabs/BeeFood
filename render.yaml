databases:
  - name: beefood-db
    plan: free
    databaseName: beefood
    user: beefood

services:
  - type: web
    name: beefood-backend
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:prod
    plan: free
    healthCheckPath: /api/tenants
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beefood-db
          property: connectionString

  - type: web
    name: beefood-frontend
    runtime: static
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: beefood-backend
          property: url
